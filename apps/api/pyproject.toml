[project]
name = "pae-api"
version = "0.1.0"
description = "NeuronaPQRS Backend — FastAPI + LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "sqlmodel>=0.0.24",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.15",
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3",
    "aiofiles>=24.1",
    "python-frontmatter>=1.1.0",
    "mcp>=1.9.0",
    "rank-bm25>=0.2.2",
    "tenacity>=9.1",
    "greenlet>=3.5.0",
    "qrcode[pil]>=7.4",
    "sentence-transformers>=3.0",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pae_api"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.11",
]
