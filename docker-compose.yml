services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pae
      POSTGRES_PASSWORD: pae123
      POSTGRES_DB: pae_pqrs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pae -d pae_pqrs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
