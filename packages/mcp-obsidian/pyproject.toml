[project]
name = "mcp-obsidian"
version = "0.1.0"
description = "MCP server for Obsidian vault (Neurona)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.11",
    "python-frontmatter>=1.1.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
mcp-obsidian = "mcp_obsidian.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_obsidian"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]
